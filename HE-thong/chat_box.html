<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tư Vấn Showroom Luxury VIP</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <a href="/HE-thong/TRANG-CHU.html" class="home-btn">
    ← Trang chủ
</a>
    <!-- Nhúng thư viện đọc Markdown & Làm sạch HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="/frontend/css/He_thong_css/chat_box.css">
</head>

<body>

    <div class="chat-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <button class="new-chat-btn" id="newChatBtn" onclick="resetChat()">
                <i class="fa-solid fa-plus"></i> Cuộc trò chuyện mới
            </button>

            <div class="history-title">Gần đây</div>
            <ul class="chat-history-list">
                <li class="chat-history-item active">
                    <i class="fa-regular fa-message"></i> Tư vấn Showroom Siêu Xe
                </li>
            </ul>

            <div class="user-profile">
                <div class="avatar"
                    style="background-image: url('https://ui-avatars.com/api/?name=VIP+Client&background=random');">
                </div>
                <div>
                    <h4 style="font-size: 0.9rem; font-weight: 600;">Khách Hàng VIP</h4>
                    <p style="font-size: 0.75rem; color: var(--text-secondary);">Showroom Access</p>
                </div>
            </div>
        </aside>

        <!-- Main Chat Panel -->
        <main class="main-chat">
            <!-- Header -->
            <header class="chat-header">
                <div class="bot-info">
                    <div class="msg-avatar assistant" style="width: 42px; height: 42px;">
                        <i class="fa-solid fa-robot" style="font-size: 1.2rem;"></i>
                    </div>
                    <div>
                        <h3 style="font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                            Showroom AI Assistant <span class="bot-status"></span>
                        </h3>
                        <p style="font-size: 0.8rem; color: var(--text-secondary);">Trợ lý tư vấn siêu xe VIP</p>
                    </div>
                </div>
            </header>

            <!-- Message Container -->
            <div class="chat-messages" id="chatMessages">
                <!-- Typing Indicator Placeholder -->
                <div class="message assistant" id="typingContainer" style="display: none;">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="typing-indicator" id="typingIndicator" style="display: flex;">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </div>

            <!-- Input Box -->
            <footer class="chat-input-container">
                <div class="input-box">
                    <!-- Đã xóa thẻ form -->
                    <textarea id="userInput" class="chat-textarea"
                        placeholder="Nhập câu hỏi tư vấn (ví dụ: Showroom có xe gì, giá dưới 10 tỷ...)..." rows="1"></textarea>
            
                    <!-- Bắt buộc dùng type="button" để nút không bao giờ submit web -->
                    <button type="button" id="sendBtn" class="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Nhúng file Javascript điều khiển -->
    <script src="/frontend/java/chat_box.js"></script>
</body>

</html>
